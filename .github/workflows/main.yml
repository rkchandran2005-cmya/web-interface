          mkdir -p "$GITHUB_WORKSPACE/site/PROJECT-7"
          cp -r dist/* "$GITHUB_WORKSPACE/site/PROJECT-7/"

      # ---------------- PROJECT 8 ----------------

      - name: Build Project 8
        run: |
          PROJECT_DIR=$(find PROJECT-8 -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$PROJECT_DIR" ]; then
