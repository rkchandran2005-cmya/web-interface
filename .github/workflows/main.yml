            exit 1
          fi

          APP_DIR=$(dirname "$PROJECT_DIR")
          cd "$APP_DIR"

          npm install
          npm run build -- --base=/web-interface/PROJECT-6/

          mkdir -p "$GITHUB_WORKSPACE/site/PROJECT-6"
          cp -r dist/* "$GITHUB_WORKSPACE/site/PROJECT-6/"

      # ---------------- PROJECT 7 ----------------

      - name: Build Project 7
        run: |
          PROJECT_DIR=$(find PROJECT-7 -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found for PROJECT-7"
            exit 1
          fi

          APP_DIR=$(dirname "$PROJECT_DIR")
          cd "$APP_DIR"

