      # ---------------- PROJECT 10 ----------------

      - name: Build Project 10
        run: |
          PROJECT_DIR=$(find PROJECT-10 -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found for PROJECT-10"
            exit 1
          fi

          APP_DIR=$(dirname "$PROJECT_DIR")
          cd "$APP_DIR"

          npm install
          npm run build -- --base=/web-interface/PROJECT-10/

          mkdir -p "$GITHUB_WORKSPACE/site/PROJECT-10"
          cp -r dist/* "$GITHUB_WORKSPACE/site/PROJECT-10/"

      # ---------------- MAIN PAGE ----------------

      - name: Create main project page
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Web Interface - 10 Projects</title>

            <style>
              body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 40px;
                background: #f5f5f5;
              }

              h1 {
                margin-bottom: 30px;
              }

              a {
                display: block;
                width: 250px;
                margin: 15px auto;
                padding: 15px;
                background: #222;
                color: white;
                text-decoration: none;
                border-radius: 8px;
              }

              a:hover {
                background: #555;
              }
            </style>
          </head>

          <body>
            <h1>Web Interface - 10 Projects</h1>

            <a href="./PROJECT-1/">PROJECT 1</a>
            <a href="./PROJECT-2/">PROJECT 2</a>
            <a href="./PROJECT-3/">PROJECT 3</a>
            <a href="./PROJECT-4/">PROJECT 4</a>
            <a href="./PROJECT-5/">PROJECT 5</a>
            <a href="./PROJECT-6/">PROJECT 6</a>
            <a href="./PROJECT-7/">PROJECT 7</a>
            <a href="./PROJECT-8/">PROJECT 8</a>
            <a href="./PROJECT-9/">PROJECT 9</a>
            <a href="./PROJECT-10/">PROJECT 10</a>
          </body>
          </html>
          EOF

      # ---------------- GITHUB PAGES ----------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
