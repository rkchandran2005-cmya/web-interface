            echo "package.json not found for PROJECT-5"
            exit 1
          fi

          APP_DIR=$(dirname "$PROJECT_DIR")
          cd "$APP_DIR"

          npm install
          npm run build -- --base=/web-interface/PROJECT-5/

          mkdir -p "$GITHUB_WORKSPACE/site/PROJECT-5"
          cp -r dist/* "$GITHUB_WORKSPACE/site/PROJECT-5/"

      # ---------------- PROJECT 6 ----------------

      - name: Build Project 6
