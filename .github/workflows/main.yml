name: Deploy All 10 Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create site folder
        run: |
          rm -rf site
          mkdir -p site

      # ---------------- PROJECT 1 ----------------

      - name: Copy Project 1
        run: |
          mkdir -p site/PROJECT-1
          cp -r PROJECT-1/* site/PROJECT-1/

      # ---------------- PROJECT 2 ----------------

      - name: Copy Project 2
        run: |
          mkdir -p site/PROJECT-2
          cp -r PROJECT-2/* site/PROJECT-2/

      # ---------------- PROJECT 3 ----------------

      - name: Build Project 3
        run: |
          PROJECT_DIR=$(find PROJECT-3 -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found for PROJECT-3"
            exit 1
          fi

          APP_DIR=$(dirname "$PROJECT_DIR")
          cd "$APP_DIR"

          npm install
          npm run build -- --base=/web-interface/PROJECT-3/

          mkdir -p "$GITHUB_WORKSPACE/site/PROJECT-3"
          cp -r dist/* "$GITHUB_WORKSPACE/site/PROJECT-3/"

      # ---------------- PROJECT 4 ----------------

      - name: Build Project 4
        run: |
          PROJECT_DIR=$(find PROJECT-4 -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found for PROJECT-4"
            exit 1
          fi

          APP_DIR=$(dirname "$PROJECT_DIR")
          cd "$APP_DIR"

          npm install
          npm run build -- --base=/web-interface/PROJECT-4/

          mkdir -p "$GITHUB_WORKSPACE/site/PROJECT-4"
          cp -r dist/* "$GITHUB_WORKSPACE/site/PROJECT-4/"

