      # ---------------- PROJECT 9 ----------------

      - name: Build Project 9
        run: |
          PROJECT_DIR=$(find PROJECT-9 -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$PROJECT_DIR" ]; then
